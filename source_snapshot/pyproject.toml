[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "known-g-physical-bridge"
version = "0.1.0"
description = "Known-g physical turbulence bridge using the frozen PiRN/P2S simulator"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "scipy==1.13.1",
  "tqdm==4.67.1",
  "webdataset==1.0.2",
]

[tool.setuptools.packages.find]
include = ["physical_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

